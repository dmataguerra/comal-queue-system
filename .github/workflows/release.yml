name: Operational validation

on:
  workflow_dispatch:
    inputs:
      full_day:
        description: Run the 390-minute endurance test on the protected runner
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: comal-production-endurance
  cancel-in-progress: false

jobs:
  full-day:
    if: ${{ inputs.full_day }}
    runs-on: [self-hosted, windows, comal-production]
    timeout-minutes: 450
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:full-day
      - name: Upload endurance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: comal-full-day-evidence
          path: test-results/**
          if-no-files-found: warn
