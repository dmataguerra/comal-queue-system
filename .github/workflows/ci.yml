name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'codex/**'
      - copilot/comal-interactive-mockup

jobs:
  baseline:
    uses: ./.github/workflows/legacy-installer.yml
  validate:
    needs: baseline
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Desktop smoke test
        id: desktop
        run: npm run test:desktop
      - name: Browser transport smoke test
        run: npm run test:browser
      - name: Announcement and async import regression test
        run: npx electron scripts/smoke-hardening.mjs
      - name: Local media smoke test
        run: npm run test:media
      - name: Full-day preflight
        run: npm run test:full-day:preflight
      - name: Audio controls smoke test
        run: npx electron scripts/smoke-audio-controls.mjs
      - name: Interface smoke test
        run: npx electron scripts/smoke-interface.mjs
      - name: Build unsigned Windows installer
        run: npm run desktop:build
      - name: Installed application smoke test
        run: npm run test:installed
      - name: Upgrade and rollback smoke test
        uses: actions/download-artifact@v4
        with:
          name: upgrade-baseline-0.2.0
          path: release/archive-0.2.0
      - name: Verify upgrade baseline hash
        shell: pwsh
        run: |
          $expected = (Get-Content 'release/archive-0.2.0/SHA256.txt').Trim()
          $actual = (Get-FileHash 'release/archive-0.2.0/Comal++ Setup 0.2.0.exe' -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Upgrade baseline hash mismatch' }
      - name: Upgrade and rollback smoke test
        run: npm run test:upgrade
      - name: Upload desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics
          path: |
            test-results/**
            **/turnero.log
          if-no-files-found: ignore
