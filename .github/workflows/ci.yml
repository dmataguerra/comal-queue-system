name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'codex/**'
      - copilot/comal-interactive-mockup

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Desktop smoke test
        id: desktop
        run: npm run test:desktop
      - name: Browser transport smoke test
        run: npm run test:browser
      - name: Local media smoke test
        run: npm run test:media
      - name: Full-day preflight
        run: npm run test:full-day:preflight
      - name: Audio controls smoke test
        run: npx electron scripts/smoke-audio-controls.mjs
      - name: Interface smoke test
        run: npx electron scripts/smoke-interface.mjs
      - name: Build unsigned Windows installer
        run: npm run desktop:build
      - name: Installed application smoke test
        run: npm run test:installed
      - name: Upgrade and rollback smoke test
        run: npm run test:upgrade
      - name: Upload desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics
          path: |
            test-results/**
            **/turnero.log
          if-no-files-found: ignore
