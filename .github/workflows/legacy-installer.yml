name: Build upgrade baseline

on:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # Última implementación 0.2.0, con SQLite y su instalador original.
          ref: 7b10bb992fe43413262e56fd0ad3a67e6ebdf489
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Electron binary
        run: npx electron --version
      - name: Build 0.2.0 installer without publishing
        run: npm run desktop:build -- --publish never
      - name: Record baseline hash
        shell: pwsh
        run: |
          (Get-FileHash 'release/Comal++ Setup 0.2.0.exe' -Algorithm SHA256).Hash | Set-Content release/SHA256.txt
      - uses: actions/upload-artifact@v6
        with:
          name: upgrade-baseline-0.2.0
          path: |
            release/Comal++ Setup 0.2.0.exe
            release/SHA256.txt
          if-no-files-found: error
