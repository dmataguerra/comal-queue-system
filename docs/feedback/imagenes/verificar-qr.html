<!doctype html>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<body style="margin:0;font:20px monospace">
<pre id="out">...</pre>
<script>
const files = ["qr-vertical.png", "qr-tv.png", "qr-solo.png", "qr-simple.png"];
Promise.all(files.map(f => new Promise(res => {
  const img = new Image();
  img.onload = () => {
    // recorte opcional = lo que encuadra la cámara del celular
    const crop = f === "qr-vertical.png" ? [220, 450, 640, 640] : [0, 0, img.width, img.height];
    const cv = document.createElement("canvas"); cv.width = crop[2]; cv.height = crop[3];
    const g = cv.getContext("2d"); g.drawImage(img, crop[0], crop[1], crop[2], crop[3], 0, 0, crop[2], crop[3]);
    const d = g.getImageData(0, 0, cv.width, cv.height);
    const r = jsQR(d.data, d.width, d.height);
    res(f + " => " + (r ? r.data : "NO SE PUDO LEER"));
  };
  img.onerror = () => res(f + " => error al cargar");
  img.src = f + "?t=" + Date.now();
}))).then(lines => { document.getElementById("out").textContent = lines.join("\n"); });
</script>
</body>
